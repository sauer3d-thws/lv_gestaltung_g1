<li><strong>2 SWS</strong> Praktische Übungen in der Gestaltung <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Stefan Sauer</li>

</li>

<li><strong>Lehrformat:</strong> 11 Termine mit integriertem <strong>Alpha-Prinzip</strong><br />
(Theorie <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> KI-Sprint <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Art-Direction).</li>
<li>Workload: 150 Std. | 60 Std. Präsenzzeit | 90 Std. Eigenstudium</li>

Was muss ich ändern?</li>

was der Mensch nicht kann?</li>

<h1 id="das-vorbild-alpha-school">Das Vorbild: Alpha School</h1>
<h3 id="das-konzept-des-%E2%80%9E2-hour-learning">Das Konzept des „2-Hour Learning“</h3>
<ul>
<li><strong>Die Grundthese:</strong>
<ul>
<li>Traditioneller Frontalunterricht ist zeitintensiv<br />
und nivelliert das Lerntempo.</li>
</ul>
</li>
<li><strong>2 Stunden adaptive KI-Mastery:</strong>
<ul>
<li>Hard Skills &amp; Fachwissen werden über<br />
KI-Tutoren im eigenen Lerntempo trainiert.</li>
<li>Fortschritt erst bei mindestens<br />
<strong>90 % Verständnis (Mastery Learning)</strong>.</li>
</ul>
</li>
<li><strong>Freiraum für echte Projekte:</strong>
<ul>
<li>Der gewonnene Freiraum fließt vollständig in<br />
praktische Projekte, Kreativität &amp; Kollaboration.</li>
</ul>
</li>
</ul>
<p><img src="img/alpha_01_two_hour_learning.jpg" alt="Alpha School Learning" /></p>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>

<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="der-rollenwandel">Der Rollenwandel</h1>
<h3 id="%E2%80%9Eguides-not-teachers-%E2%80%93-vom-erkl%C3%A4rer-zum-mentor">„Guides, not Teachers“ – Vom Erklärer zum Mentor</h3>
<ul>
<li><strong>Traditionelle Dozentenrolle:</strong>
<ul>
<li>Dozierende erklären Werkzeugmenüs, Klickpfade<br />
und Standard-Shortcuts.</li>
</ul>
</li>
<li><strong>Die neue Dozentenrolle (Art Director &amp; Coach):</strong>
<ul>
<li>Individuelles Mentoring, Qualitätsprüfung<br />
und konzeptionelle Schärfung.</li>
</ul>
</li>
<li><strong>KI als persönlicher 1-on-1 Software-Tutor:</strong>
<ul>
<li>Löst Klick-Blockaden, erklärt Shortcuts<br />
und filtert Werkzeug-Workflows <em>in Echtzeit</em>.</li>
</ul>
</li>
</ul>
<p><img src="img/alpha_02_guides_not_teachers.jpg" alt="Guides not Teachers" /></p>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>

<h1 id="aufgabenstellung-plakatdesign">Aufgabenstellung: Plakatdesign</h1>
<h3 id="semesteraufgabe-%E2%80%9Emein-lieblingsort">Semesteraufgabe „Mein Lieblingsort“</h3>
<ul>
<li><strong>Format &amp; Ausgabe:</strong>
<ul>
<li>Großformatplakat <strong>DIN A1</strong> (594 × 841 mm, 3 mm Anschnitt).</li>
<li>Zweifache Abgabe: <strong>Digital</strong> (PDF/X-4 &amp; InDesign-Paket) und <strong>Gedruckt</strong></li>
</ul>
</li>
<li><strong>Thema:</strong>
<ul>
<li><em>„Mein Lieblingsort“</em> (in Würzburg oder am eigenen Heimat-/Wohnort).</li>
</ul>
</li>
<li><strong>Bildmaterial &amp; Perspektiven:</strong>
<ul>
<li><strong>Mindestens 5 eigene Fotos</strong> im finalen Layout integriert.</li>
<li>Abwechslungsreicher Perspektiven-Mix: <em>Totale, Halbtotale &amp; Detail</em></li>
</ul>
</li>
<li><strong>Texte &amp; Typografie:</strong>
<ul>
<li>Kurze, prägnante Copy (Headline, Subline, kurze Ortsbeschreibung/Fakten)</li>
</ul>
</li>
</ul>

<h1 id="das-alpha-prinzip-je-lehrtermin">Das Alpha-Prinzip je Lehrtermin</h1>
<h3 id="strukturierung-der-90-min%C3%BCtigen-einheiten">Strukturierung der 90-minütigen Einheiten</h3>
<ol>
<li><strong>15 Min. Theorie-Flash:</strong><br />

<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="t01-theorie-plakatwirkung">T01 Theorie: Plakatwirkung</h1>
<h3 id="fernwirkung-vs-nahwirkung">Fernwirkung vs. Nahwirkung</h3>
<ul>
<li><strong>3-Sekunden-Regel:</strong> Das Auge entscheidet in<br />
Millisekunden über Relevanz.</li>
<li><strong>Fernwirkung (3–5 m):</strong>
<ul>
<li>Klares Key-Visual und dominante Headline.</li>
<li>Hoher Kontrast, reduzierte Komplexität.</li>
</ul>
</li>
<li><strong>Nahwirkung (1–2 m &amp; Leseabstand):</strong>
<ul>
<li>Feine Details, Mikrotypografie, Storytelling.</li>
</ul>
</li>
<li><strong>Visual Hook:</strong> Ein unerwarteter Blickwinkel erzeugt Neugier.</li>
</ul>
<p><img src="img/03_komposition.jpg" alt="Plakatwirkung" /></p>
<h6 id="visuelle-hierarchie-br-plakate-m%C3%BCssen-auf-distanz-fesseln-und-im-detail-informieren"><strong>Visuelle Hierarchie</strong> <br /> Plakate müssen auf Distanz fesseln und im Detail informieren.</h6>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer" data-footer="[Zurück zur Übersicht](#9)" data-class="small-text img-right" data-theme="thws-sts" lang="en-US" class="small-text img-right" data-marpit-pagination="18" style="--paginate:true;--header:**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer;--footer:[Zurück zur Übersicht](#9);--class:small-text img-right;--theme:thws-sts;" data-marpit-pagination-total="108">
<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="theorie-die-3-sekunden-regel">Theorie: Die 3-Sekunden-Regel</h1>
<h3 id="wahrnehmungskaskade-im-plakatdesign">Wahrnehmungskaskade im Plakatdesign</h3>
<ul>
<li><strong>Sekunde 1: Der Eye-Catcher (Fernwirkung 3–5 m)</strong>
<ul>
<li>Ein dominantes Key-Visual stoppt den Blick</li>
<li>Hoher Figur-Grund-Kontrast &amp; markante<br />
Silhouette als Anker.</li>
</ul>
</li>
<li><strong>Sekunde 2: Die Kernbotschaft (2–3 m)</strong>
<ul>
<li>Die Headline beantwortet in Sekundenbruchteilen:<br />
<em>Worum geht es?</em></li>
<li>Sofortige thematische Einordnung des<br />
Lieblingsorts ohne kognitive Hürde.</li>
</ul>
</li>
<li><strong>Sekunde 3: Der Visual Hook (1–2 m &amp; Nahbereich)</strong>
<ul>
<li>Subline &amp; Detailkomposition wecken Neugier<br />
zum Herantreten -&gt; Entdeckungsebene / Details</li>
</ul>
</li>
</ul>
<p><img src="img/3_sekunden_regel.jpg" alt="alt text" /></p>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer" data-footer="[Zurück zur Übersicht](#9)" data-class="img-right small-text" data-theme="thws-sts" lang="en-US" class="img-right small-text" data-marpit-pagination="19" style="--paginate:true;--header:**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer;--footer:[Zurück zur Übersicht](#9);--class:img-right small-text;--theme:thws-sts;" data-marpit-pagination-total="108">
<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h2 id="plakat-praxis-der-3-sekunden-check">Plakat-Praxis: Der 3-Sekunden-Check</h2>
<ul>
<li><strong>1) Der Kneiftest (Squint Test):</strong>
<ul>
<li>Augen zusammenkneifen: Bilden Key-Visual und Headline eine sofort erfassbare Einheit oder zerfällt das Layout?</li>
</ul>
</li>
<li><strong>2) 1 dominantes Key-Visual statt Bild-Konkurrenz:</strong>
<ul>
<li>Nicht 5 gleich große Fotos nebeneinander platzieren!</li>
<li>1 starkes Master-Foto für Fernwirkung</li>
<li>weitere Bilder für Nahbereich.</li>
</ul>
</li>
</ul>
<p><img src="img/Geschtte-des-Plakats_Henri_de_Toulouse-Lautrec-680x999.jpg" alt="alt text" /></p>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer" data-footer="[Zurück zur Übersicht](#9)" data-class="img-right small-text" data-theme="thws-sts" lang="en-US" class="img-right small-text" data-marpit-pagination="20" style="--paginate:true;--header:**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer;--footer:[Zurück zur Übersicht](#9);--class:img-right small-text;--theme:thws-sts;" data-marpit-pagination-total="108">
<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<ul>
<li><strong>3) Eindeutige Blickachse (Visual Flow):</strong>
<ul>
<li>Führe den Blick von Bilddominante zu Headline,<br />
weiter zur Subline – kein ungeführtes Suchen.</li>
</ul>
</li>
<li><strong>4) Weißraum als Schutzraum:</strong>
<ul>
<li>Ausreichend Freiraum rund um die Kernbotschaft<br />
schützt vor Reizüberflutung<br />
<strong>Tipp: Weißraum muss nicht weiß sein ;)</strong></li>
</ul>
</li>
</ul>
<p><img src="img/15_grid_check.jpg" alt="Praxis Check" /></p>
<h6 id="didaktischer-check-br-erst-wenn-sekunde-1-gewinnt-werden-die-ebenen-f%C3%BCr-sekunde-2-und-3-%C3%BCberhaupt-wahrgenommen"><strong>Didaktischer Check</strong> <br /> Erst wenn Sekunde 1 gewinnt, werden die Ebenen für Sekunde 2 und 3 überhaupt wahrgenommen.</h6>

<h1 id="f%C3%BChrungslinien--fluchtpunkte">Führungslinien &amp; Fluchtpunkte</h1>
<h3 id="blicklenkung-und-r%C3%A4umliche-tiefe-im-2d-medium">Blicklenkung und räumliche Tiefe im 2D-Medium</h3>
<ul>
<li><strong>Visuelle Straßen (Leading Lines):</strong>
<ul>
<li>Straßen, Kanten, Geländer oder Schienen<br />
lenken den Blick aktiv.</li>
</ul>
</li>
<li><strong>Fluchtpunkt &amp; Tiefensog:</strong>
<ul>
<li>Konvergierende Linien erzeugen einen<br />
unwiderstehlichen Tiefensog.</li>
</ul>
</li>
<li><strong>Zielgerichtete Blickführung:</strong>
<ul>
<li>Das Auge folgt Linien intuitiv bis zum Endpunkt<br />
– dort muss die Kernbotschaft stehen.</li>
</ul>
</li>
<li><strong>Diagonale Dynamik:</strong>
<ul>
<li>Diagonale Linien bringen Energie, Tempo und<br />
Dramatik ins Bild.</li>
</ul>
</li>
</ul>

<h1 id="licht--kontrastumfang">Licht &amp; Kontrastumfang</h1>
<h3 id="zeichnung-in-h%C3%B6hen-und-tiefen-beherrschen">Zeichnung in Höhen und Tiefen beherrschen</h3>
<ul>
<li><strong>Dynamikumfang kontrollieren:</strong>
<ul>
<li>Der Kamerasensor sieht anders als das<br />
menschliche Auge – RAW ist Pflicht.</li>
</ul>
</li>
<li><strong>Histogramm als objektiver Maßstab:</strong>
<ul>
<li>Gleichmäßige Tonwertkurve ohne Tonwertabrisse.</li>
<li><em>Schatten:</em> Zeichnung in dunklen Zonen erhalten.</li>
<li><em>Lichter:</em> Details in hellen Wolken / Himmeln sichern.</li>
</ul>
</li>
<li><strong>Chiaroscuro &amp; Lichtführung:</strong>
<ul>
<li>Gezielt gesetztes Streiflicht und Schatten staffeln<br />
den Raum plastisch.</li>
</ul>
</li>
</ul>

<h1 id="formatbewusstsein-hochformat">Formatbewusstsein: Hochformat</h1>
<h3 id="vertikales-denken-f%C3%BCr-das-plakatformat-din-a1">Vertikales Denken für das Plakatformat DIN A1</h3>
<ul>
<li><strong>Das DIN-Seitenverhältnis (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.225ex;" xmlns="http://www.w3.org/2000/svg" width="6.078ex" height="2.398ex" role="img" focusable="false" viewBox="0 -960.5 2686.6 1060"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g><g data-mml-node="mo" transform="translate(777.8,0)"><path data-c="3A" d="M78 370Q78 394 95 412T138 430Q162 430 180 414T199 371Q199 346 182 328T139 310T96 327T78 370ZM78 60Q78 84 95 102T138 120Q162 120 180 104T199 61Q199 36 182 18T139 0T96 17T78 60Z"></path></g><g data-mml-node="msqrt" transform="translate(1333.6,0)"><g transform="translate(853,0)"><g data-mml-node="mn"><path data-c="32" d="M109 429Q82 429 66 447T50 491Q50 562 103 614T235 666Q326 666 387 610T449 465Q449 422 429 383T381 315T301 241Q265 210 201 149L142 93L218 92Q375 92 385 97Q392 99 409 186V189H449V186Q448 183 436 95T421 3V0H50V19V31Q50 38 56 46T86 81Q115 113 136 137Q145 147 170 174T204 211T233 244T261 278T284 308T305 340T320 369T333 401T340 431T343 464Q343 527 309 573T212 619Q179 619 154 602T119 569T109 550Q109 549 114 549Q132 549 151 535T170 489Q170 464 154 447T109 429Z"></path></g></g><g data-mml-node="mo" transform="translate(0,100.5)"><path data-c="221A" d="M95 178Q89 178 81 186T72 200T103 230T169 280T207 309Q209 311 212 311H213Q219 311 227 294T281 177Q300 134 312 108L397 -77Q398 -77 501 136T707 565T814 786Q820 800 834 800Q841 800 846 794T853 782V776L620 293L385 -193Q381 -200 366 -200Q357 -200 354 -197Q352 -195 256 15L160 225L144 214Q129 202 113 190T95 178Z"></path></g><rect width="500" height="60" x="853" y="840.5"></rect></g></g></g></svg></mjx-container>):</strong>
<ul>
<li>Vertikale Proportion verlangt  Denken in Ebenen.</li>
</ul>
</li>
<li><strong>Die 3-Zonen-Architektur im Plakat:</strong>
<ul>
<li><strong>Oberes Drittel (Ruhezone / Himmel):</strong> Negativraum<br />
für plakative Headlines &amp; freigestellte Typografie.</li>
<li><strong>Mittleres Drittel (Fokuszone):</strong><br />
Hauptmotiv und Landmarke.</li>
<li><strong>Unteres Drittel (Vordergrund):</strong><br />
Textur, Einbettung &amp; Fakten.</li>
</ul>
</li>
<li><strong>Freiraum mitfotografieren:</strong>
<ul>
<li>Schon beim Shooting genügend „Fleisch“ für Ränder<br />
und Beschnitt einplanen!</li>
</ul>
</li>
</ul>

<h1 id="t02-praxis-camera-raw--ki-workflow">T02 Praxis: Camera Raw &amp; KI-Workflow</h1>
<h3 id="digitale-negativentwicklung-in-photoshop">Digitale Negativentwicklung in Photoshop</h3>
<ul>
<li><strong>Aufgabenstellung:</strong>
<ul>
<li>Sichte deine 20–30 Fotos und wähle die Top 3 Kandidaten.</li>
<li>Führe eine vollständige RAW-Entwicklung im Camera-Raw-Filter durch.</li>
</ul>
</li>
<li><strong>Arbeitsschritte:</strong>
<ul>
<li>Weißabgleich kalibrieren, Belichtung/Kontrast justieren.</li>
<li>Lichter absenken, Tiefen aufhellen, Textur &amp; Klarheit gezielt dosieren.</li>
</ul>
</li>
</ul>
<p><img src="img/04_camera_raw.jpg" alt="Camera Raw" /></p>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>

<li><strong>Ergebnis-Checkliste:</strong>
<ul>
<li>[ ] 1 Hauptmotiv ausgewählt   (ca. 12 MP, hochaufl.).</li>

(kein Clipping im Histogramm).</li>

<li>[ ] Datei als verlustfreies Master (<code>.psd</code> oder <code>.tif</code>) gesichert.</li>
</ul>
</li>
<li><strong>Art-Director-Check:</strong>
<ul>
<li>
<p>Bildaufbau geeignet für Typografie-Überlagerungen?</p>

</li>

<h1 id="t03-theorie-farbpsychologie">T03 Theorie: Farbpsychologie</h1>
<h3 id="emotion--raumwirkung-durch-farbe">Emotion &amp; Raumwirkung durch Farbe</h3>
<ul>
<li><strong>Farbklima &amp; Tonalität:</strong>
<ul>
<li>Warme Farbtöne (Rot, Orange) wirken nah,<br />
aktiv und einladend.</li>
<li>Kühle Farbtöne (Blau, Cyan) schaffen Distanz,<br />
Ruhe und Weite.</li>
</ul>
</li>
<li><strong>Komplementär- &amp; Simultankontrast:</strong>
<ul>
<li>Gezielter Einsatz von Akzentfarben zur Aufmerksamkeitssteuerung.</li>
</ul>
</li>
<li><strong>Atmosphärische Tiefe:</strong>
<ul>
<li>Vordergrund kontrastreich/gesättigt<br />
<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Hintergrund weicher/aufgehellt.</li>
</ul>
</li>
</ul>
<p><img src="img/06_farbpsychologie.jpg" alt="Farbpsychologie" /></p>
<h6 id="farbdynamik-br-gezielte-farbkontraste-steuern-die-emotionale-grundstimmung"><strong>Farbdynamik</strong> <br /> Gezielte Farbkontraste steuern die emotionale Grundstimmung.</h6>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer" data-footer="[Zurück zur Übersicht](#9)" data-class="img-right small-text" data-theme="thws-sts" lang="en-US" class="img-right small-text" data-marpit-pagination="39" style="--paginate:true;--header:**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer;--footer:[Zurück zur Übersicht](#9);--class:img-right small-text;--theme:thws-sts;" data-marpit-pagination-total="108">
<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="farbklima--tonalit%C3%A4t">Farbklima &amp; Tonalität</h1>
<h3 id="emotionale-raumwirkung-durch-farbtemperatur">Emotionale Raumwirkung durch Farbtemperatur</h3>
<ul>
<li><strong>Warme Farbwelten (3200 K · Rot, Orange, Ocker):</strong>
<ul>
<li>Wirken einladend, lebendig, nah und aktivierend.</li>
<li><em>Optischer Vorstoß:</em> Warme Töne treten im Raum<br />
optisch nach vorne.</li>
</ul>
</li>
<li><strong>Kühle Farbwelten (6500 K · Cyan, Blau, Indigo):</strong>
<ul>
<li>Transportieren Ruhe, Sachlichkeit, Melancholie<br />
oder Weite.</li>
<li><em>Optisches Zurückweichen:</em> Kühle Flächen erzeugen<br />
Distanz und Tiefe.</li>
</ul>
</li>
<li><strong>Konzeptueller Nutzen im Plakat:</strong>
<ul>
<li>Definiert den Charakter des Lieblingsorts</li>
</ul>
</li>
</ul>
<p><img src="img/t03_farbklima.jpg" alt="Farbklima &amp; Tonalität" /></p>
<h6 id="farbtemperatur-br-warme-t%C3%B6ne-treten-optisch-hervor-k%C3%BChle-farben-weichen-zur%C3%BCck"><strong>Farbtemperatur</strong> <br /> Warme Töne treten optisch hervor, kühle Farben weichen zurück.</h6>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer" data-footer="[Zurück zur Übersicht](#9)" data-class="img-right small-text" data-theme="thws-sts" lang="en-US" class="img-right small-text" data-marpit-pagination="40" style="--paginate:true;--header:**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer;--footer:[Zurück zur Übersicht](#9);--class:img-right small-text;--theme:thws-sts;" data-marpit-pagination-total="108">
<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="komplement%C3%A4r---simultankontrast">Komplementär- &amp; Simultankontrast</h1>
<h3 id="maximale-leuchtkraft--aufmerksamkeitssteuerung">Maximale Leuchtkraft &amp; Aufmerksamkeitssteuerung</h3>
<ul>
<li><strong>Komplementärkontrast (Teal &amp; Orange / Blau &amp; Gold):</strong>
<ul>
<li>Gegenüberliegende Farben im Farbkreis erzeugen<br />
maximale visuelle Spannung.</li>
<li>Unverzichtbar für Eye-Catcher (Fernwirkung)</li>
</ul>
</li>
<li><strong>Die 80/20-Harmonieregel:</strong>
<ul>
<li>80 % dominante Grundstimmung</li>
<li>20 % komplementärer Farbakzent.</li>
</ul>
</li>
<li><strong>Simultankontrast (Wahrnehmungstäuschung):</strong>
<ul>
<li>Das Auge beeinflusst angrenzende Farben gegenseitig<br />
(z. B. neutrales Grau wirkt neben warmem<br />
Gelborange kühl-bläulich).</li>
</ul>
</li>
</ul>
<p><img src="img/t03_komplementaer.jpg" alt="Komplementärkontrast" /></p>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer" data-footer="[Zurück zur Übersicht](#9)" data-class="img-right small-text" data-theme="thws-sts" lang="en-US" class="img-right small-text" data-marpit-pagination="41" style="--paginate:true;--header:**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer;--footer:[Zurück zur Übersicht](#9);--class:img-right small-text;--theme:thws-sts;" data-marpit-pagination-total="108">
<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="atmosph%C3%A4rische-tiefe">Atmosphärische Tiefe</h1>
<h3 id="raumstaffelung-durch-luftpersp--farbverlauf">Raumstaffelung durch Luftpersp. &amp; Farbverlauf</h3>
<ul>
<li><strong>Vordergrund (Nahbereich):</strong>
<ul>
<li>Höchste Farbsättigung, tiefe Schatten, maximale Kantenkontraste und warme Farbtöne.</li>
</ul>
</li>
<li><strong>Mittelgrund (Übergangszone):</strong>
<ul>
<li>Ausgewogene Farbbalance &amp; weichere<br />
Tonwertübergänge.</li>
</ul>
</li>
<li><strong>Hintergrund (Fernbereich):</strong>
<ul>
<li>Entsättigung, Aufhellung durch atmosphärischen<br />
Dunst/Nebel &amp; Verschiebung ins Kühle</li>
</ul>
</li>
<li><strong>Photoshop-Compositing:</strong>
<ul>
<li>Gezielte Schnittmasken &amp; Kurven für<br />
Vorder-/ Mittel- / Hintergrund.</li>
</ul>
</li>
</ul>
<p><img src="img/t03_atmosphaerische_tiefe.jpg" alt="Atmosphärische Tiefe" /></p>
<h6 id="luftperspektive-br-kontrast--und-s%C3%A4ttigungsabnahme-erzeugt-glaubhafte-tiefenwirkung"><strong>Luftperspektive</strong> <br /> Kontrast- und Sättigungsabnahme erzeugt glaubhafte Tiefenwirkung.</h6>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>

<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="t03-praxis-non-destructive-workflow">T03 Praxis: Non-Destructive Workflow</h1>
<h3 id="arbeiten-mit-gradationskurven--schnittmasken">Arbeiten mit Gradationskurven &amp; Schnittmasken</h3>
<ul>
<li><strong>Aufgabenstellung:</strong>
<ul>
<li>Optimiere das Hauptmotiv ausschließlich über <strong>Einstellungsebenen</strong>.</li>
<li>Erstelle getrennte Korrekturen für Vorder-, Mittel- und Hintergrund.</li>
</ul>
</li>
<li><strong>Kerntechniken:</strong>
<ul>
<li>Gradationskurven für S-Kurven-Kontraste.</li>
<li>Farbbalance &amp; selektive Farbkorrektur mit Schnittmasken (<code>Alt + Klick</code>).</li>
</ul>
</li>
</ul>
<p><img src="img/07_photoshop_ebenen.jpg" alt="Photoshop Ebenen" /></p>
<h6 id="non-destructive-br-originalpixel-bleiben-zu-100--unangetastet"><strong>Non-Destructive</strong> <br /> Originalpixel bleiben zu 100 % unangetastet.</h6>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>

<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<p><strong>KI-Beratung:</strong></p>
<blockquote>

<h1 id="t04-theorie-figur--grund">T04 Theorie: Figur &amp; Grund</h1>
<h3 id="wahrnehmungsebenen-im-plakatdesign">Wahrnehmungsebenen im Plakatdesign</h3>
<ul>
<li><strong>Gestaltgesetz der Geschlossenheit &amp; Nähe:</strong>
<ul>
<li>Das menschliche Gehirn trennt automatisch Vordergrund (Figur) vom Hintergrund (Grund).</li>
</ul>
</li>
<li><strong>Kantenkontrast &amp; Schärfentiefe:</strong>
<ul>
<li>Scharfe Kanten ziehen den Blick an;<br />
weiche Kanten erzeugen Raum.</li>
</ul>
</li>
<li><strong>Ebenenstaffelung:</strong>
<ul>
<li>Freigestellte Bildelemente ermöglichen das spätere<br />
Hinter- oder Vor-die-Schrift-Legen in InDesign.</li>
</ul>
</li>
</ul>
<p><img src="img/09_figur_grund.jpg" alt="Figur Grund" /></p>
<h6 id="gestaltgesetze-br-klare-trennung-von-figur-und-raum-schafft-visuelle-ordnung"><strong>Gestaltgesetze</strong> <br /> Klare Trennung von Figur und Raum schafft visuelle Ordnung.</h6>

<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="gestaltgesetze-geschlossenheit--n%C3%A4he">Gestaltgesetze: Geschlossenheit &amp; Nähe</h1>
<h3 id="wahrnehmungspsychologie-im-plakatlayout">Wahrnehmungspsychologie im Plakatlayout</h3>
<ul>
<li><strong>Gestaltgesetz der Nähe (Proximity):</strong>
<ul>
<li>Nah beieinander liegende Bildelemente &amp; Textzeilen werden automatisch als Sinneinheit interpretiert.</li>
</ul>
</li>
<li><strong>Gestaltgesetz der Geschlossenheit (Closure):</strong>
<ul>
<li>Das Auge schließt lückenhafte Konturen zu<br />
vollständigen Formen (Scheinkonturen).</li>
<li>Gestaltflächen benötigen oft keine störenden Rahmen.</li>
</ul>
</li>
<li><strong>Figur-Grund-Primat:</strong>
<ul>
<li>Das Gehirn fokussiert prioritär auf die dominierende<br />
Figur (Key-Visual) vor dem passiven Grund.</li>
</ul>
</li>
</ul>
<p><img src="img/t04_gestaltgesetze.jpg" alt="Gestaltgesetze" /></p>

<h1 id="kantenkontrast--sch%C3%A4rfentiefe">Kantenkontrast &amp; Schärfentiefe</h1>
<h3 id="fokussteuerung-sch%C3%A4rfe--maskenpr%C3%A4zision">Fokussteuerung: Schärfe &amp; Maskenpräzision</h3>
<ul>
<li><strong>Blickführung durch Schärfentiefe:</strong>
<ul>
<li>Offenblende erzeugt Bokeh im Hintergrund<br />
– der Blick springt unweigerlich auf das scharfe Hauptmotiv.</li>
</ul>
</li>
<li><strong>Kantenkontrast (Edge Acuity):</strong>
<ul>
<li>Knackige Kanten heben die Figur plastisch vom Hintergrund ab.</li>
</ul>
</li>
<li><strong>Saubere Freistellungs-Qualität:</strong>
<ul>
<li><em>Fehler vermeiden:</em> Unschöne weiße Farbsäume<br />
(Halos) zerstören die Illusion.</li>

<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.439ex;" xmlns="http://www.w3.org/2000/svg" width="5.91ex" height="1.946ex" role="img" focusable="false" viewBox="0 -666 2612 860"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g><g data-mml-node="TeXAtom" data-mjx-texclass="ORD" transform="translate(500,0)"><g data-mml-node="mo"><path data-c="2C" d="M78 35T78 60T94 103T137 121Q165 121 187 96T210 8Q210 -27 201 -60T180 -117T154 -158T130 -185T117 -194Q113 -194 104 -185T95 -172Q95 -168 106 -156T131 -126T157 -76T173 -3V9L172 8Q170 7 167 6T161 3T152 1T140 0Q113 0 96 17Z"></path></g></g><g data-mml-node="mn" transform="translate(778,0)"><path data-c="35" d="M164 157Q164 133 148 117T109 101H102Q148 22 224 22Q294 22 326 82Q345 115 345 210Q345 313 318 349Q292 382 260 382H254Q176 382 136 314Q132 307 129 306T114 304Q97 304 95 310Q93 314 93 485V614Q93 664 98 664Q100 666 102 666Q103 666 123 658T178 642T253 634Q324 634 389 662Q397 666 402 666Q410 666 410 648V635Q328 538 205 538Q174 538 149 544L139 546V374Q158 388 169 396T205 412T256 420Q337 420 393 355T449 201Q449 109 385 44T229 -22Q148 -22 99 32T50 154Q50 178 61 192T84 210T107 214Q132 214 148 197T164 157Z"></path></g><g data-mml-node="mtext" transform="translate(1278,0)"><path data-c="A0" d=""></path><path data-c="70" d="M36 -148H50Q89 -148 97 -134V-126Q97 -119 97 -107T97 -77T98 -38T98 6T98 55T98 106Q98 140 98 177T98 243T98 296T97 335T97 351Q94 370 83 376T38 385H20V408Q20 431 22 431L32 432Q42 433 61 434T98 436Q115 437 135 438T165 441T176 442H179V416L180 390L188 397Q247 4 <h1 id="ebenenstaffelung">Ebenenstaffelung</h1>
<h3 id="r%C3%A4umliche-tiefe-auf-der-2d-plakatfl%C3%A4che">Räumliche Tiefe auf der 2D-Plakatfläche</h3>
<ul>
<li><strong>Staffelung auf der Z-Achse:</strong>
<ul>
<li><strong>Ebene 1 (Grund):</strong> Atmosphäre &amp; RAW-Hintergrundbild.</li>
<li><strong>Ebene 2 (Typo):</strong> Dominante Headline läuft <em>hinter</em><br />
das Motiv.</li>
<li><strong>Ebene 3 (Figur):</strong> Freigestelltes Smart-Objekt ragt<br />
<em>vor</em> die Schrift.</li>
<li><strong>Ebene 4 (Mikrotypo):</strong> Sublines, Infoblock &amp; Textumfluss.</li>
</ul>
</li>
<li><strong>Smart-Objekt-Vorteil:</strong>
<ul>
<li>Verlustfreie Skalierung und native Verknüpfung zwischen Photoshop und InDesign.</li>
</ul>
</li>
</ul>
<p><img src="img/t04_ebenenstaffelung.jpg" alt="Ebenenstaffelung" /></p>

<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="t04-praxis-pr%C3%A4zisionsmaskierung--ki">T04 Praxis: Präzisionsmaskierung &amp; KI</h1>
<h3 id="zeichenstift-masken-feinschliff--smart-objekt">Zeichenstift, Masken-Feinschliff &amp; Smart-Objekt</h3>
<ul>
<li><strong>Aufgabenstellung:</strong>
<ul>
<li>Isoliere ein zentrales Element (Architektur, Person, Landmarke) deines Motivs.</li>
<li>Konvertiere das freigestellte Element in ein <strong>Smart-Objekt</strong>.</li>
</ul>
</li>
<li><strong>Methoden-Mix:</strong>
<ul>
<li>Harte Kanten: Vektorpuffer mit dem Zeichenstift-Werkzeug</li>
<li>Organische Kanten (Haare/Bäume): <em>Auswählen und Maskieren</em> mit Kanten-Verbessern-Pinsel.</li>
</ul>
</li>
</ul>
<p><img src="img/10_maskierung.jpg" alt="Maskierung" /></p>
<h6 id="freistelltechnik-br-pr%C3%A4zision-an-den-konturen-entscheidet-%C3%BCber-die-glaubw%C3%BCrdigkeit"><strong>Freistelltechnik</strong> <br /> Präzision an den Konturen entscheidet über die Glaubwürdigkeit.</h6>

<p><em>„Erkläre mir den Workflow, wie ich in Photoshop mit dem Pfadwerkzeug ein Element freistelle, danach den Pfad in eine Vektormaske umwandeln und Kanten um 0,5 px nach innen verlege.“</em></p>
</blockquote>

<h1 id="t04-zielerreichung--check-in">T04 Zielerreichung &amp; Check-in</h1>
<h3 id="welche-ergebnisse-m%C3%BCssen-vorliegen-3">Welche Ergebnisse müssen vorliegen?</h3>
<ul>
<li><strong>Ergebnis-Checkliste:</strong>
<ul>
<li>[ ] Mindestens 1 saubere Ebenenmaske ohne Farbsäume oder Fransen.</li>
<li>[ ] Kein zerstörerisches Löschen mit dem Radiergummi.</li>
<li>[ ] Freigestelltes Element liegt als <strong>Smart-Objekt</strong> vor (skalierbar &amp; austauschbar).</li>
<li>[ ] Kontrollansicht auf schwarzem, weißem und 50%-grauem Hintergrund bestanden.</li>
</ul>
</li>
<li><strong>Art-Director-Check:</strong>
<ul>
<li>Halten die Kanten der 100%-Zoomansicht für den A1-Großdruck stand?</li>
</ul>
</li>
</ul>
<p><img src="img/11_kantenpr_fung.jpg" alt="Kantenprüfung" /></p>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Abgabe Bild mit Smart-Objekt als psd im Elearning</p>

<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="t05-theorie-bildharmonie">T05 Theorie: Bildharmonie</h1>
<h3 id="blickf%C3%BChrung-durch-reduktion">Blickführung durch Reduktion</h3>
<ul>
<li><strong>Entrümpeln des Bildraums:</strong>
<ul>
<li>Schilder, Müll, Passanten und stürzende Linien<br />
lenken vom Hauptmotiv ab.</li>
</ul>
</li>
<li><strong>Cinematisches Color-Grading:</strong>
<ul>
<li>Einheitlicher Farb-Look bindet zusammengesetzte<br />
Elemente harmonisch zusammen.</li>
</ul>
</li>
<li><strong>Split-Toning &amp; Farbharmonien:</strong>
<ul>
<li>Komplementäre Farbgebung für Lichter<br />
(z. B. Warmgold) und Schatten (z. B. Tiefcyan).</li>
</ul>
</li>
</ul>
<p><img src="img/12_color_grading.jpg" alt="Color Grading" /></p>
<h6 id="visual-look-br-farbgrading-erzeugt-emotionale-dichte-und-eine-filmische-atmosph%C3%A4re"><strong>Visual Look</strong> <br /> Farbgrading erzeugt emotionale Dichte und eine filmische Atmosphäre.</h6>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-header="**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer" data-footer="[Zurück zur Übersicht](#9)" data-class="img-right small-text" data-theme="thws-sts" lang="en-US" class="img-right small-text" data-marpit-pagination="55" style="--paginate:true;--header:**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer;--footer:[Zurück zur Übersicht](#9);--class:img-right small-text;--theme:thws-sts;" data-marpit-pagination-total="108">
<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="entr%C3%BCmpeln-des-bildraums">Entrümpeln des Bildraums</h1>
<h3 id="blickf%C3%BChrung-durch-bewusste-reduktion">Blickführung durch bewusste Reduktion</h3>
<ul>
<li><strong>Visuelle Störfaktoren eliminieren:</strong>
<ul>
<li>Schilder, Mülleimer, parkende Autos und zufällige<br />
Passanten lenken vom Lieblingsort ab.</li>
</ul>
</li>
<li><strong>Konzentration auf das Wesentliche:</strong>
<ul>
<li>Weniger visuelles Rauschen verstärkt die emotionale Kernaussage des Motivs.</li>
</ul>
</li>
<li><strong>Flächen für Typografie schaffen:</strong>
<ul>
<li>Durch gezielte Retusche und Bildberuhigung entstehen<br />
ruhige Negativräume für Headlines und Textblöcke.</li>
</ul>
</li>
</ul>
<p><img src="img/t05_entruempeln.jpg" alt="Entrümpeln des Bildraums" /></p>
<h6 id="bildbereinigung-br-ruhige-fl%C3%A4chen-lenken-den-blick-auf-die-kernaussage"><strong>Bildbereinigung</strong> <br /> Ruhige Flächen lenken den Blick auf die Kernaussage.</h6>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-header="**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer" data-footer="[Zurück zur Übersicht](#9)" data-class="img-right small-text" data-theme="thws-sts" lang="en-US" class="img-right small-text" data-marpit-pagination="56" style="--paginate:true;--header:**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer;--footer:[Zurück zur Übersicht](#9);--class:img-right small-text;--theme:thws-sts;" data-marpit-pagination-total="108">
<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="cinematisches-color-grading">Cinematisches Color-Grading</h1>
<h3 id="stimmungsaufbau--visuelle-klammer">Stimmungsaufbau &amp; visuelle Klammer</h3>
<ul>
<li><strong>Harmonisierung im Compositing:</strong>
<ul>
<li>Ein einheitliches Grading bindet freigestellte Elemente und Hintergründe nahtlos zusammen.</li>
</ul>
</li>
<li><strong>Filmischer Look durch LUTs &amp; Verläufe:</strong>
<ul>
<li>Look-Up Tables und Verlaufsumsetzungen verleihen dem Motiv eine unverwechselbare filmische Atmosphäre.</li>
</ul>
</li>
<li><strong>Tonwertabstimmung für den Druck:</strong>
<ul>
<li>Saubere S-Kurven sorgen für knackige Tiefen ohne Tonwertabrisse oder absaufende Schatten.</li>
</ul>
</li>
</ul>
<p><img src="img/t05_cinematic_grading.jpg" alt="Color Grading" /></p>
<h6 id="atmosph%C3%A4re-br-farbgrading-erzeugt-emotionale-dichte-und-visuelle-koh%C3%A4renz"><strong>Atmosphäre</strong> <br /> Farbgrading erzeugt emotionale Dichte und visuelle Kohärenz.</h6>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-header="**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer" data-footer="[Zurück zur Übersicht](#9)" data-class="img-right small-text" data-theme="thws-sts" lang="en-US" class="img-right small-text" data-marpit-pagination="57" style="--paginate:true;--header:**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer;--footer:[Zurück zur Übersicht](#9);--class:img-right small-text;--theme:thws-sts;" data-marpit-pagination-total="108">
<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="split-toning--farbharmonien">Split-Toning &amp; Farbharmonien</h1>
<h3 id="komplement%C3%A4re-farbdynamik-in-licht--schatten">Komplementäre Farbdynamik in Licht &amp; Schatten</h3>
<ul>
<li><strong>Klassischer Teal &amp; Orange-Look:</strong>
<ul>
<li>Warme Gold-/Bernsteintöne in den Lichtern kombiniert<br />
mit kühlem Cyan/Petrol in den Tiefen.</li>
</ul>
</li>
<li><strong>Dreidimensionale Raumwirkung:</strong>
<ul>
<li>Farbkontraste unterstützen die Tiefenwirkung<br />
(helle, warme Lichter treten hervor,<br />
kühle Schatten weichen zurück).</li>
</ul>
</li>
<li><strong>Subtiler Einsatz:</strong>
<ul>
<li>Gezielte Deckkraftsteuerung erhält natürliche<br />
Haut- und Materialtexturen.</li>
</ul>
</li>
</ul>
<p><img src="img/t05_splittoning.jpg" alt="Split-Toning" /></p>
<h6 id="split-toning-br-komplement%C3%A4re-farbgebung-in-lichtern-und-schatten-schafft-plastizit%C3%A4t"><strong>Split-Toning</strong> <br /> Komplementäre Farbgebung in Lichtern und Schatten schafft Plastizität.</h6>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-header="**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer" data-footer="[Zurück zur Übersicht](#9)" data-class="img-right small-text" data-theme="thws-sts" lang="en-US" class="img-right small-text" data-marpit-pagination="58" style="--paginate:true;--header:**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer;--footer:[Zurück zur Übersicht](#9);--class:img-right small-text;--theme:thws-sts;" data-marpit-pagination-total="108">
<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="t05--praxis-retusche--look-entwicklung">T05 · Praxis: Retusche &amp; Look-Entwicklung</h1>
<h3 id="high-end-finishing--generatives-erweitern">High-End Finishing &amp; Generatives Erweitern</h3>
<ul>
<li><strong>Aufgabenstellung:</strong>
<ul>
<li>Bereinige Bildstörungen in den ausgwählten Bildern<br />
mit dem Reparatur-Pinsel   und Ausbessern-Werkzeug.</li>
<li>Erweitere bei Bedarf den Bildrand generativ für Textfreiräume im A1-Format.</li>
<li>Tipp: Die Bilder können in InDesign im Format beschnitten werden.</li>
<li>Erstelle einen konsistenten Farblook über Verlaufsumsetzungen / LUTs.</li>
</ul>
</li>
</ul>
<p><img src="img/12_retusche_finishing.jpg" alt="Retusche" /></p>
<h6 id="finishing-br-bereinigte-fl%C3%A4chen-schaffen-platz-f%C3%BCr-typografische-botschaften"><strong>Finishing</strong> <br /> Bereinigte Flächen schaffen Platz für typografische Botschaften.</h6>

</section>

<li>[ ] Keine störenden Artefakte / Bildelemente im Motiv.</li>
<li>[ ] Bildformat und Auflösung entsprechen A1<br />
(min. 150–200 ppi effektiv).</li>
<li>[ ] Stimmiger Gesamt-Farblook</li>
<li>[ ] Photoshop-Dateien (<code>.psd</code>) final gespeichert &amp; archiviert.</li>
</ul>
</li>
<li><strong>Art-Director-Check:</strong>

<li><strong>Finale Freigabe des Key-Visuals!</strong> Ab jetzt wechseln<br />

<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="randabst%C3%A4nde--stege-im-gro%C3%9Fformat">Randabstände &amp; Stege im Großformat</h1>
<h3 id="satzspiegel-architektur-raum-zum-atmen">Satzspiegel-Architektur: Raum zum Atmen</h3>
<ul>
<li><strong>Warum Plakate „Luft“ brauchen:</strong>
<ul>
<li>Großflächen wirken aus der Distanz,   zu enge Stege<br />
wirken gequetscht, unruhig &amp; erdrücken das Motiv.</li>
</ul>
</li>
<li><strong>Sicherheits- &amp; Rahmenabstände (min. 25–40 mm):</strong>
<ul>
<li>Schützt Texte vor dem Abschneiden durch Schneidetoleranzen in der Druckerei.</li>
<li>Verhindert Verdeckung durch Rahmen,<br />
Passepartouts oder Hängeleisten.</li>
</ul>
</li>
<li><strong>Klassischer Stegausgleich (Proportionsregel):</strong>
<ul>
<li><strong>Fußsteg &gt; Außensteg &gt; Kopfsteg:</strong> Der Fußsteg wird traditionell am größten gewählt, damit das Layout<br />
optisch stabil steht &amp; nicht „nach unten absackt“.</li>
</ul>
</li>
</ul>

<h1 id="modulare-raster-in-der-praxis">Modulare Raster in der Praxis</h1>
<h3 id="das-docking-prinzip-in-adobe-indesign">Das Docking-Prinzip in Adobe InDesign</h3>
<ul>
<li><strong>Strikte Kantenbindung (Docking):</strong>
<ul>
<li>Kein Element „schwebt“ frei im Raum: Alle Bild- &amp; Textboxen schließen bündig an Rasterlinie ab.</li>
</ul>
</li>
<li><strong>Hierarchische Spaltenbelegung:</strong>
<ul>
<li><strong>Headline:</strong> Spannt über 8 bis 12 Spalten für maximale Fernwirkung.</li>
<li><strong>Key-Visual:</strong> Füllt z. B. 7 / 8 Spalten asymmetrisch aus.</li>
<li><strong>Subline &amp; Bodycopy:</strong> Bündeln sich in 3 bis 5 Spalten für ergonomische Zeilenlängen.</li>
</ul>
</li>
<li><strong>Der Gutter als Weißraum-Garant:</strong>
<ul>
<li>Verhindert, dass benachbarte Textblöcke &amp;<br />
Bildränder unschön aneinanderkleben.</li>
</ul>
</li>
</ul>

<ul>
<li>Lege ein neues Dokument an: <strong>DIN A1</strong>, 1 Seite,<br />
Anschnitt 3 mm rundum.</li>
<li>Richte auf der <strong>Musterseite A</strong> ein (12-Spalten-) Raster<br />
mit 5 mm Spaltenabstand ein.</li>
<li>Definiere ein Grundlinienraster (passend zur<br />
späteren Grundschrift).</li>
<li>Füge erste Inhalte ein.</li>
</ul>
</li>
</ul>

<h1 id="t07-theorie-typo-auf-distanz">T07 Theorie: Typo auf Distanz</h1>
<h3 id="die-drei-informationsebenen">Die drei Informationsebenen</h3>
<ul>
<li><strong>Ebene 1: Headline (Fernbereich 3–5 m)</strong>
<ul>
<li>Groß, plakativ, emotional.<br />
Schriftgröße ca. 72–120 pt+.</li>
</ul>
</li>
<li><strong>Ebene 2: Subline / Teaser (Nahbereich 1–2 m)</strong>
<ul>
<li>Erklärt den Kontext, Schriftgröße ca. 28–48 pt.</li>
</ul>
</li>
<li><strong>Ebene 3: Bodycopy / Fakten (Leseabstand 0,5 m)</strong>
<ul>
<li>Detailinformationen, Koordinaten, Infotext. Schriftgröße ca. 14–20 pt.</li>
</ul>
</li>
<li><strong>Schriftmischung:</strong>
<ul>
<li>Maximal 2 Schriftfamilien (z. B. markante Grotesk + elegante Antiqua).</li>
</ul>
</li>
</ul>

<h1 id="t07-praxis-formate--ki-copywriting">T07 Praxis: Formate &amp; KI-Copywriting</h1>
<h3 id="absatzformate-einrichten--texte-schleifen">Absatzformate einrichten &amp; Texte schleifen</h3>
<ul>
<li><strong>Aufgabenstellung:</strong>
<ul>
<li>Lege in InDesign Absatzformate an (<code>H1_Headline</code>, <code>H2_Subline</code>, <code>P_Body</code>, <code>Meta_Info</code>).</li>
<li>Aktiviere die <strong>Optische Steganpassung</strong><br />
Optical Margin Alignment).</li>
<li>Nutze ein LLM, um prägnante, poetische oder informative Texte für deinen Ort zu schreiben.</li>
</ul>
</li>
</ul>

Gestaltgesetze &amp; Ebenenstaffelung wirksam?</li>

Konsistentes Color-Grading? Textfreiräume da?</li>

Stege mit min. 25–40 mm Luft? 3 mm Anschnitt angelegt?</li>

<h1 id="t08-theorie-design-kritik">T08 Theorie: Design-Kritik</h1>
<h3 id="feedback-professionell-geben--empfangen">Feedback professionell geben &amp; empfangen</h3>
<ul>
<li><strong>Deskriptiv statt wertend:</strong>
<ul>
<li>Nicht <em>„Gefällt mir nicht“</em>, sondern <em>„Die Subline konkurriert im Kontrast mit der Gebäude-Kante“</em>.</li>
</ul>
</li>
<li><strong>Die 4 Säulen des Plakat-Checks:</strong>
<ol>
<li><strong>Story &amp; Idee:</strong> Wird der Lieblingsort spürbar?</li>
<li><strong>Hierarchie &amp; Lesbarkeit:</strong> Stimmt die Leserichtung?</li>
<li><strong>Bildqualität &amp; Schnitt:</strong> Sitzen Masken und Bilddetails?</li>
<li><strong>Komposition:</strong> Ist das Layout ausbalanciert?</li>
</ol>
</li>
</ul>
<p><img src="img/22_design_kritik.jpg" alt="Design Kritik" /></p>
<h6 id="peer-review-br-konstruktives-feedback-sch%C3%A4rft-den-blick-f%C3%BCr-details-und-fehler"><strong>Peer Review</strong> <br /> Konstruktives Feedback schärft den Blick für Details und Fehler.</h6>

</ul>
</li>
</ul>

<h1 id="t09--theorie-wei%C3%9Fraum--fusion">T09 · Theorie: Weißraum &amp; Fusion</h1>
<h3 id="harmonie-zwischen-bild-und-schrift">Harmonie zwischen Bild und Schrift</h3>
<ul>
<li><strong>Mut zur Leere (Negative Space):</strong>
<ul>
<li>Weißraum ist kein verschenkter Platz, sondern<br />
der stärkste Verstärker für Inhalt.</li>
</ul>
</li>
<li><strong>Text-Bild-Verschmelzung:</strong>
<ul>
<li>Schrift hinter freigestellten Bildelementen erzeugt Dreidimensionalität.</li>
</ul>
</li>
<li><strong>Mikrotypografie:</strong>
<ul>
<li>Zeilenabstand (Leading) und optischer<br />
Zeilenausgleich für ruhigen Grauwert.</li>
</ul>
</li>
<li><strong>Keine visuellen Konkurrenzen:</strong>
<ul>
<li>Das Auge braucht einen eindeutigen Einstiegspunkt.</li>
</ul>
</li>
</ul>
<p><img src="img/19_wei_raum.jpg" alt="Weißraum" /></p>
<h6 id="negativer-raum-br-erst-durch-bewusste-leere-entfaltet-die-gestaltung-ihre-volle-wucht"><strong>Negativer Raum</strong> <br /> Erst durch bewusste Leere entfaltet die Gestaltung ihre volle Wucht.</h6>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-header="**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer" data-footer="[Zurück zur Übersicht](#9)" data-class="img-right small-text" data-theme="thws-sts" lang="en-US" class="img-right small-text" data-marpit-pagination="89" style="--paginate:true;--header:**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer;--footer:[Zurück zur Übersicht](#9);--class:img-right small-text;--theme:thws-sts;" data-marpit-pagination-total="108">
<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="mut-zur-leere-negative-space">Mut zur Leere (Negative Space)</h1>
<h3 id="wei%C3%9Fraum-als-aktiver-inhaltsverst%C3%A4rker">Weißraum als aktiver Inhaltsverstärker</h3>
<ul>
<li><strong>Weißraum ist kein verschenkter Platz:</strong>
<ul>
<li>Unbespielte Flächen erzeugen Ruhe, Exklusivität und Eleganz im Großformat.</li>
</ul>
</li>
<li><strong>Optischer Resonanzraum:</strong>
<ul>
<li>Erst durch bewusste Leere entfaltet das Hauptmotiv<br />
seine maximale Wucht und Strahlkraft.</li>
</ul>
</li>
<li><strong>Fokuslenkung:</strong>
<ul>
<li>Das Auge wird ohne Ablenkung direkt auf die Headline und das Key-Visual geführt.</li>
</ul>
</li>
</ul>
<p><img src="img/t09_negativer_raum.jpg" alt="Negativer Raum" /></p>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>

<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="text-bild-verschmelzung">Text-Bild-Verschmelzung</h1>
<h3 id="dreidimensionale-raumwirkung-auf-der-2d-fl%C3%A4che">Dreidimensionale Raumwirkung auf der 2D-Fläche</h3>
<ul>
<li><strong>Räumliche Interaktion (Z-Achse):</strong>
<ul>
<li>Große Headline-Buchstaben laufen hinter freigestellten Gebäudekanten oder Personen vorbei.</li>
</ul>
</li>
<li><strong>Die Illusion von Tiefe:</strong>
<ul>
<li>Die Überlagerung bricht das statische Layout auf und erzeugt plastische Räumlichkeit.</li>
</ul>
</li>
<li><strong>Voraussetzung:</strong>
<ul>
<li>Absolut saubere Freistellerpfade aus Photoshop als Vektormasken oder Alphakanäle in InDesign.</li>
</ul>
</li>
</ul>
<p><img src="img/t09_text_bild_verschmelzung.jpg" alt="Text-Bild-Fusion" /></p>
<h6 id="el-lissitzky-udssr-ausstellung-im-kunstgewerbemuseum-z%C3%BCrich-1929">El Lissitzky, UdSSR Ausstellung im Kunstgewerbemuseum, Zürich, 1929</h6>

</li>

<h1 id="t09-zielerreichung--check-in">T09 Zielerreichung &amp; Check-in</h1>
<h3 id="welche-ergebnisse-m%C3%BCssen-vorliegen-8">Welche Ergebnisse müssen vorliegen?</h3>
<ul>
<li><strong>Ergebnis-Checkliste:</strong>
<ul>
<li>[ ] Dateien nativ verknüpft (keine fehlenden Links)</li>
<li>[ ] Harmonische Text-Bild-Interaktion ohne störende Überschneidungen.</li>
<li>[ ] Keine Textverdeckung wichtiger Bildelemente.</li>
<li>[ ] Ausgewogenes Verhältnis zwischen Bilddynamik<br />
&amp; Weißraum.</li>
</ul>
</li>
<li><strong>Art-Director-Check:</strong>
<ul>
<li>Bilden Typografie und Fotografie eine unzertrennliche visuelle Einheit?</li>
</ul>
</li>
</ul>
<p><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Abgabe des aktualisierten Plakates im PDF-Format im Elearning.</p>

<h1 id="t10-theorie-detailtypografie">T10 Theorie: Detailtypografie</h1>
<h3 id="handwerkliche-perfektion-im-mengensatz">Handwerkliche Perfektion im Mengensatz</h3>
<ul>
<li><strong>Satzfehler eliminieren:</strong>
<ul>
<li>Keine <strong>Hurenkinder</strong> (letzte Zeile am Spaltenanfang)<br />
oder <strong>Schusterjungen</strong> (erste Zeile am Spaltenende).</li>
<li>Keine alleinstehenden Einzelwörter am Absatzende (Witwen).</li>
</ul>
</li>
<li><strong>Typografische Sonderzeichen:</strong>
<ul>
<li>Echte Anführungszeichen („...“), Bis-Striche (Geviert/Halbgeviert – statt Bindestrich -).</li>
<li>Geschützte Leerzeichen bei Abkürzungen<br />
(z. B. <em>z. B.</em>, <em>5 ECTS</em>).</li>
</ul>
</li>
</ul>

<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="hurenkinder-schusterjungen--witwen">Hurenkinder, Schusterjungen &amp; Witwen</h1>
<ul>
<li><strong>Schusterjunge (Orphan):</strong>
<ul>
<li>Die <em>erste Zeile</em> eines neuen Absatzes steht ganz allein<br />
am <em>Ende</em> einer Spalte/Seite.</li>
<li><em>Eselsbrücke:</em> Hat die ganze Zukunft (den Absatz)<br />
noch vor sich.</li>
</ul>
</li>
<li><strong>Hurenkind (Widow / schwerster Satzfehler):</strong>
<ul>
<li>Die <em>letzte Zeile</em> eines Absatzes steht einsam am<br />
<em>Kopf</em> einer neuen Spalte/Seite.</li>
<li><em>Eselsbrücke:</em> Hat keine Zukunft mehr<br />
(reißt den Lesefluss komplett ab).</li>
</ul>
</li>
<li><strong>Witwen / Alleinstehende Einzelwörter (Runts):</strong>
<ul>
<li>Ein kurzes Einzelwort auf der letzten Zeile eines<br />
Absatzes erzeugt  „Löcher“ im Satzspiegel.</li>
</ul>
</li>
</ul>
<p><img src="img/t10_satzfehler_hurenkinder_schusterjungen.jpg" alt="Satzfehler Hurenkinder Schusterjungen" /></p>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="99" data-paginate="true" data-header="**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer" data-footer="[Zurück zur Übersicht](#9)" data-class="img-right small-text" data-theme="thws-sts" lang="en-US" class="img-right small-text" data-marpit-pagination="99" style="--paginate:true;--header:**Gestaltung und Design G1** &lt;br&gt; FOL Stefan Sauer;--footer:[Zurück zur Übersicht](#9);--class:img-right small-text;--theme:thws-sts;" data-marpit-pagination-total="108">
<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="typografische-sonderzeichen">Typografische Sonderzeichen</h1>
<ul>
<li><strong>Echte Anführungszeichen (D-A-CH):</strong>
<ul>
<li><strong>99 unten &amp; 66 oben:</strong> „Schweinfurt“ statt (&quot;...&quot;`)</li>
<li><em>Schweiz / Frankreich:</em> «Guillemets» mit Spitzen<br />
nach innen.</li>
</ul>
</li>
<li><strong>Bis-Strich &amp; Gedankenstrich (– En-Dash):</strong>
<ul>
<li><strong>Bis-Strich (ohne Spatium):</strong><br />
<code>10:00–18:00 Uhr</code>, <code>Würzburg–Schweinfurt</code>.</li>
<li><strong>Gedankenstrich (mit Spatium):</strong><br />
<code>Design – als Haltung – wirkt</code>.</li>
<li><em>Fehler:</em> Kurzer Viertelgeviert-/Trennstrich (<code>-</code>).</li>
</ul>
</li>
<li><strong>Geschützte Leerzeichen (<code>Strg + Alt + X</code>):</strong>
<ul>
<li>Bindet Abkürzungen (<code>z.~B.</code>, <code>u.~a.</code>, <code>d.~h.</code>) / Maßeinheiten (<code>500~m</code>, <code>12~ECTS</code>, <code>19,90~€</code>)</li>
</ul>
</li>
</ul>
<p><img src="img/t10_typografische_sonderzeichen.jpg" alt="Typografische Sonderzeichen" /></p>
<footer><a href="#9">Zurück zur Übersicht</a></footer>
</section>

<li><strong>Aufgabenstellung:</strong>

automatisch mit geschützten Leerzeichen<br />
zu binden.</li>
<li>Optimiere die Silbentrennung<br />
(maximal 2 Trennungen in Folge,<br />
min. 3 Buchstaben vor/nach Trennung).</li>
</ul>
</li>
</ul>

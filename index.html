<h3 id="rahmenbedingungen--didaktisches-konzept">Rahmenbedingungen &amp; Didaktisches Konzept</h3>

<li><strong>Umfang:</strong> 4 SWS Gesamtmodul (5 ECTS)
<ul>
<li><strong>2 SWS</strong> Grundlagen der Gestaltung (Suse Spanheimer)</li>
<li><strong>2 SWS</strong> Gestaltung und Design G1 (Stefan Sauer)</li>
</ul>
</li>
<li><strong>Semesterziel:</strong> Konzeption, Gestaltung und druckfertige Reinzeichnung eines großformatigen Plakats (<strong>DIN A1</strong>) zum Thema <em>„Mein Lieblingsort“</em>.</li>
<li><strong>Lehrformat:</strong> 12 Studio-Termine mit integriertem <strong>Alpha-Prinzip</strong> (Theorie <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> KI-Sprint <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Art-Direction).</li>
</ul>

<h1 id="das-alpha-prinzip-je-lehrtermin">Das Alpha-Prinzip je Lehrtermin</h1>
<h3 id="strukturierung-der-90-min%C3%BCtigen-einheiten">Strukturierung der 90-minütigen Einheiten</h3>
<ol>
<li><strong>15 Min. Theorie-Flash:</strong><br />
Kompakte visuelle Inputs zu Gestaltgesetzen, Komposition, Typografie, Farbmanagement und Druckvorstufe.</li>
<li><strong>60 Min. Studio-Sprint &amp; KI-Tutoring:</strong><br />
Eigenständige Software-Praxis in Adobe Photoshop / InDesign mit KI als interaktivem Co-Piloten für Workflows und Klickpfade.</li>
<li><strong>15 Min. Art-Director-Check-in &amp; Zielerreichung:</strong><br />
Prüfung der erarbeiteten Artefakte, Peer-Feedback und Freigabe des Zwischenstandes.</li>
</ol>

<header><strong>Gestaltung und Design G1</strong> <br /> FOL Stefan Sauer</header>

<h1 id="semester%C3%BCbersicht-4-bl%C3%B6cke--12-termine">Semesterübersicht: 4 Blöcke · 12 Termine</h1>
<ul>
<li><strong>Block 1: Konzept, Storytelling &amp; Fotografie</strong>
<ul>
<li>Termin 1 (07.10.): Kickoff, Storytelling &amp; Motivwahl</li>
<li>Termin 2 (28.10.): Bildanalyse &amp; RAW-Entwicklung</li>
</ul>
</li>
<li><strong>Block 2: Bildbearbeitung &amp; Compositing (Photoshop)</strong>
<ul>
<li>Termin 3 (04.11.): Nicht-destruktive Bildbearbeitung &amp; Farbe</li>
<li>Termin 4 (11.11.): Freistellen &amp; Maskierungstechniken</li>
<li>Termin 5 (18.11.): Visual Look, Retusche &amp; Grading</li>
</ul>
</li>
<li><strong>Block 3: Layout, Raster &amp; Typografie (InDesign)</strong>
<ul>
<li>Termin 6 (25.11.): DIN A1 Setup &amp; Rastersysteme</li>
<li>Termin 7 (02.12.): Typografische Hierarchie &amp; Textgestaltung</li>
<li>Termin 8 (09.12.): Bild-Text-Integration &amp; Effekte</li>
</ul>
</li>
<li><strong>Block 4: Review, Reinzeichnung &amp; Druckvorstufe</strong>

<h1 id="t01--1-theorie-plakatwirkung">T01 · 1) Theorie: Plakatwirkung</h1>
<h3 id="fernwirkung-vs-nahwirkung">Fernwirkung vs. Nahwirkung</h3>
<ul>
<li><strong>3-Sekunden-Regel:</strong> Das Auge entscheidet in Millisekunden über Relevanz.</li>
<li><strong>Fernwirkung (3–5 m):</strong>
<ul>
<li>Klares Key-Visual und dominante Headline.</li>
<li>Hoher Kontrast, reduzierte Komplexität.</li>
</ul>
</li>
<li><strong>Nahwirkung (1–2 m &amp; Leseabstand):</strong>
<ul>
<li>Feine Details, Mikrotypografie, Storytelling.</li>
</ul>
</li>
<li><strong>Visual Hook:</strong> Ein unerwarteter Blickwinkel erzeugt Neugier.</li>
</ul>
<p><img src="https://images.unsplash.com/photo-1572945753563-804fddf04343?auto=format&amp;fit=crop&amp;w=800&amp;q=80" alt="Plakatwirkung" /></p>
<h6 id="visuelle-hierarchie-br-plakate-m%C3%BCssen-auf-distanz-fesseln-und-im-detail-informieren"><strong>Visuelle Hierarchie</strong> <br /> Plakate müssen auf Distanz fesseln und im Detail informieren.</h6>
</section>

<h1 id="t02--2-praxis-camera-raw--ki-workflow">T02 · 2) Praxis: Camera Raw &amp; KI-Workflow</h1>
<h3 id="digitale-negativentwicklung-in-photoshop">Digitale Negativentwicklung in Photoshop</h3>
<ul>
<li><strong>Aufgabenstellung:</strong>
<ul>
<li>Sichte deine 20–30 Fotos und wähle die Top 3 Kandidaten.</li>
<li>Führe eine vollständige RAW-Entwicklung im Camera-Raw-Filter durch.</li>
</ul>
</li>
<li><strong>Arbeitsschritte:</strong>
<ul>
<li>Weißabgleich kalibrieren, Belichtung/Kontrast justieren.</li>
<li>Lichter absenken, Tiefen aufhellen, Textur &amp; Klarheit gezielt dosieren.</li>
</ul>
</li>
<li><strong>KI-Beratung:</strong>
<blockquote>
<p><em>„Mein Smartphone-Foto hat starkes Bildrauschen in den Schatten und überstrahlte Wolken. Welche Regler im Camera-Raw-Filter bringen Zeichnung zurück, ohne Artefakte zu erzeugen?“</em></p>
</blockquote>
</li>
</ul>
<p><img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&amp;fit=crop&amp;w=800&amp;q=80" alt="Camera Raw" /></p>

<h1 id="t03--1-theorie-farbpsychologie">T03 · 1) Theorie: Farbpsychologie</h1>
<h3 id="emotion--raumwirkung-durch-farbe">Emotion &amp; Raumwirkung durch Farbe</h3>
<ul>
<li><strong>Farbklima &amp; Tonalität:</strong>
<ul>
<li>Warme Farbtöne (Rot, Orange) wirken nah, aktiv und einladend.</li>
<li>Kühle Farbtöne (Blau, Cyan) schaffen Distanz, Ruhe und Weite.</li>
</ul>
</li>
<li><strong>Komplementär- &amp; Simultankontrast:</strong>
<ul>
<li>Gezielter Einsatz von Akzentfarben zur Aufmerksamkeitssteuerung.</li>
</ul>
</li>
<li><strong>Atmosphärische Tiefe:</strong>
<ul>
<li>Vordergrund kontrastreich/gesättigt <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> Hintergrund weicher/aufgehellt.</li>
</ul>
</li>
</ul>
<p><img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&amp;fit=crop&amp;w=800&amp;q=80" alt="Farbpsychologie" /></p>
<h6 id="farbdynamik-br-gezielte-farbkontraste-steuern-die-emotionale-grundstimmung"><strong>Farbdynamik</strong> <br /> Gezielte Farbkontraste steuern die emotionale Grundstimmung.</h6>

</ul>

<li><strong>Randabstände im Plakat:</strong>
<ul>
<li>Plakate brauchen „Luft“: Stege dürfen im Großformat niemals zu eng bemessen sein (min. 25–40 mm).</li>

</ul>
</li>

</ul>
</li>
</ul>

<h3 id="mathematische-pr%C3%A4zision-im-indesign-dokument">Mathematische Präzision im InDesign-Dokument</h3>
<ul>
<li><strong>Aufgabenstellung:</strong>
<ul>
<li>Lege ein neues Dokument an: <strong>DIN A1</strong>, 1 Seite, Anschnitt 3 mm rundum.</li>
<li>Richte auf der <strong>Musterseite A</strong> ein 12-Spalten-Raster mit 5 mm Spaltenabstand ein.</li>
<li>Definiere ein Grundlinienraster (passend zur späteren Grundschrift).</li>
</ul>
</li>
<li><strong>KI-Beratung:</strong>
<blockquote>

</blockquote>
</li>
</ul>

<h1 id="t07--1-theorie-typo-auf-distanz">T07 · 1) Theorie: Typo auf Distanz</h1>
<h3 id="die-drei-informationsebenen">Die drei Informationsebenen</h3>
<ul>
<li><strong>Ebene 1: Headline (Fernbereich 3–5 m)</strong>
<ul>
<li>Groß, plakativ, emotional. Schriftgröße ca. 72–120 pt+.</li>
</ul>
</li>
<li><strong>Ebene 2: Subline / Teaser (Nahbereich 1–2 m)</strong>
<ul>
<li>Erklärt den Kontext, Schriftgröße ca. 28–48 pt.</li>
</ul>
</li>
<li><strong>Ebene 3: Bodycopy / Fakten (Leseabstand 0,5 m)</strong>
<ul>
<li>Detailinformationen, Koordinaten, Infotext. Schriftgröße ca. 14–20 pt.</li>
</ul>
</li>
<li><strong>Schriftmischung:</strong>
<ul>
<li>Maximal 2 Schriftfamilien (z. B. markante Grotesk + elegante Antiqua).</li>
</ul>
</li>
</ul>
<p><img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&amp;fit=crop&amp;w=800&amp;q=80" alt="Typografie" /></p>
<h6 id="schrifthierarchie-br-klare-gr%C3%B6%C3%9Fenkontraste-leiten-den-blick-von-wichtig-zu-detail"><strong>Schrifthierarchie</strong> <br /> Klare Größenkontraste leiten den Blick von Wichtig zu Detail.</h6>
</section>

<h1 id="t07--2-praxis-formate--ki-copywriting">T07 · 2) Praxis: Formate &amp; KI-Copywriting</h1>
<h3 id="absatzformate-einrichten--texte-schleifen">Absatzformate einrichten &amp; Texte schleifen</h3>
<ul>
<li><strong>Aufgabenstellung:</strong>
<ul>
<li>Lege in InDesign Absatzformate an (<code>H1_Headline</code>, <code>H2_Subline</code>, <code>P_Body</code>, <code>Meta_Info</code>).</li>
<li>Aktiviere die <strong>Optische Steganpassung</strong> (Optical Margin Alignment).</li>
<li>Nutze ein LLM, um prägnante, poetische oder informative Texte für deinen Ort zu schreiben.</li>
</ul>
</li>
<li><strong>KI-Beratung:</strong>
<blockquote>
<p><em>„Schreibe mir 3 Varianten für eine kurze, packende Subline (max. 15 Wörter) und einen Bodytext (max. 60 Wörter) über die historische Atmosphäre der Schweinfurter Mainlände.“</em></p>
</blockquote>
</li>
</ul>
<p><img src="https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&amp;fit=crop&amp;w=800&amp;q=80" alt="Formatvorlagen" /></p>

<h1 id="t08--1-theorie-wei%C3%9Fraum--fusion">T08 · 1) Theorie: Weißraum &amp; Fusion</h1>
<h3 id="harmonie-zwischen-bild-und-schrift">Harmonie zwischen Bild und Schrift</h3>
<ul>
<li><strong>Mut zur Leere (Negative Space):</strong>
<ul>
<li>Weißraum ist kein verschenkter Platz, sondern der stärkste Verstärker für Inhalt.</li>
</ul>
</li>
<li><strong>Text-Bild-Verschmelzung:</strong>
<ul>
<li>Schrift hinter freigestellten Bildelementen erzeugt Dreidimensionalität.</li>
</ul>
</li>
<li><strong>Mikrotypografie:</strong>
<ul>
<li>Zeilenabstand (Leading) und optischer Zeilenausgleich für ruhigen Grauwert.</li>
</ul>
</li>
<li><strong>Keine visuellen Konkurrenzen:</strong>
<ul>
<li>Das Auge braucht einen eindeutigen Einstiegspunkt.</li>
</ul>
</li>
</ul>
<p><img src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&amp;fit=crop&amp;w=800&amp;q=80" alt="Weißraum" /></p>
<h6 id="negativer-raum-br-erst-durch-bewusste-leere-entfaltet-die-gestaltung-ihre-volle-wucht"><strong>Negativer Raum</strong> <br /> Erst durch bewusste Leere entfaltet die Gestaltung ihre volle Wucht.</h6>
</section>

<h1 id="t09--1-theorie-design-kritik">T09 · 1) Theorie: Design-Kritik</h1>
<h3 id="feedback-professionell-geben--empfangen">Feedback professionell geben &amp; empfangen</h3>
<ul>
<li><strong>Deskriptiv statt wertend:</strong>
<ul>
<li>Nicht <em>„Gefällt mir nicht“</em>, sondern <em>„Die Subline konkurriert im Kontrast mit der Gebäude-Kante“</em>.</li>
</ul>
</li>
<li><strong>Die 4 Säulen des Plakat-Checks:</strong>
<ol>
<li><strong>Story &amp; Idee:</strong> Wird der Lieblingsort spürbar?</li>
<li><strong>Hierarchie &amp; Lesbarkeit:</strong> Stimmt die Leserichtung?</li>
<li><strong>Bildqualität &amp; Schnitt:</strong> Sitzen Masken und Bilddetails?</li>
<li><strong>Komposition:</strong> Ist das Layout ausbalanciert?</li>
</ol>
</li>
</ul>
<p><img src="https://images.unsplash.com/photo-1531403009284-440f080d1e12?auto=format&amp;fit=crop&amp;w=800&amp;q=80" alt="Design Kritik" /></p>
<h6 id="peer-review-br-konstruktives-feedback-sch%C3%A4rft-den-blick-f%C3%BCr-details-und-fehler"><strong>Peer Review</strong> <br /> Konstruktives Feedback schärft den Blick für Details und Fehler.</h6>
</section>

<h3 id="strukturierte-peer-reviews-in-3er-teams">Strukturierte Peer-Reviews in 3er-Teams</h3>
<ul>
<li><strong>Ablauf des Sprints:</strong>
<ul>
<li><strong>2 Min.:</strong> Designer/in pitcht das Plakat (Konzept, Hürden, Zielgruppe).</li>
<li><strong>3 Min.:</strong> 2 Peers analysieren das Layout anhand des standardisierten Bewertungsbogens.</li>
<li><strong>1 Min.:</strong> Konsolidierung der 3 wichtigsten Handlungsempfehlungen.</li>
</ul>
</li>
<li><strong>KI-Beratung:</strong>
<blockquote>
<p><em>„Formuliere eine strukturierte Checkliste für ein Design-Review eines Großflächenplakats mit Fokus auf Typografie, Kontrastverhältnisse und Bildschärfe.“</em></p>
</blockquote>
</li>
</ul>

<h1 id="t10--1-theorie-detailtypografie">T10 · 1) Theorie: Detailtypografie</h1>
<h3 id="handwerkliche-perfektion-im-mengensatz">Handwerkliche Perfektion im Mengensatz</h3>
<ul>
<li><strong>Satzfehler eliminieren:</strong>
<ul>
<li>Keine <strong>Hurenkinder</strong> (letzte Zeile am Spaltenanfang) oder <strong>Schusterjungen</strong> (erste Zeile am Spaltenende).</li>
<li>Keine alleinstehenden Einzelwörter am Absatzende (Witwen).</li>
</ul>
</li>
<li><strong>Typografische Sonderzeichen:</strong>
<ul>
<li>Echte Anführungszeichen („...“), Bis-Striche (Geviert/Halbgeviert – statt Bindestrich -).</li>
<li>Geschützte Leerzeichen bei Abkürzungen (z. B. <em>z. B.</em>, <em>5 ECTS</em>).</li>
</ul>
</li>
</ul>
<p><img src="https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&amp;fit=crop&amp;w=800&amp;q=80" alt="Detailtypografie" /></p>
<h6 id="mikrotypografie-br-der-unterschied-zwischen-amateur-und-profi-liegt-in-den-details"><strong>Mikrotypografie</strong> <br /> Der Unterschied zwischen Amateur und Profi liegt in den Details.</h6>
</section>

<h1 id="t10--2-praxis-grep--trennungen-in-indesign">T10 · 2) Praxis: GREP &amp; Trennungen in InDesign</h1>
<h3 id="satzregeln-automatisieren">Satzregeln automatisieren</h3>
<ul>
<li><strong>Aufgabenstellung:</strong>
<ul>
<li>Richte GREP-Stile in den Absatzformaten ein, um einbuchstabige Wörter und Einheiten automatisch mit geschützten Leerzeichen zu binden.</li>
<li>Optimiere die Silbentrennung (maximal 2 Trennungen in Folge, min. 3 Buchstaben vor/nach Trennung).</li>
</ul>
</li>

<blockquote>

</li>
</ul>
